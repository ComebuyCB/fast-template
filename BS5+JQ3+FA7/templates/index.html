<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="shortcut Icon" type="image/x-icon" href="">
    <link rel="icon" type="image/png" sizes="16x16" href="">
    <link rel="icon" type="image/png" sizes="32x32" href="">
    <link rel="icon" type="image/png" sizes="96x96" href="">

    <title></title>

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100..900&family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- core -->
    <script src="/static/core/jquery-3.6.4/jquery.min.js"></script>
    <link href="/static/core/bootstrap-5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <script src="/static/core/bootstrap-5.3.8/js/bootstrap.bundle.min.js"></script>

    <!-- plugins -->
    <link href="/static/plugins/fontawesome-free-7.3.1-web/css/all.min.css" rel="stylesheet">

    <!-- main -->
    <link href="/static/common/css/main.css" rel="stylesheet">
    <script src="/static/common/js/main.js"></script>

    <!-- 主題需在畫面渲染前套用，避免深色模式先閃一下亮色 -->
    <script>
        const $html = $('html')
        const THEME_KEY = 'theme'
        setTheme(getStoredTheme() || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'))
        function setTheme(theme){
            $html.attr('data-bs-theme', theme)
        }
        function getStoredTheme(){
            try { return localStorage.getItem(THEME_KEY) } catch(e) { return null }
        }
        function storeTheme(theme){
            try { localStorage.setItem(THEME_KEY, theme) } catch(e) {}
        }
    </script>
</head>
<body>
    <div id="wrap">
        <header>
            <script>$.get('_layout/header.html', (res)=>{ $('header')[0].outerHTML = res })</script>
        </header>

        <main>
            <section class="container-xl py-5">
                <div class="d-flex align-items-center justify-content-between gap-2 mb-2">
                    <h2 class="h4 mb-0">按鈕範例</h2>
                    <button class="btn btn_outline_primary js-theme-toggle" type="button"><i class="fas fa-adjust me-2" aria-hidden="true"></i>切換主題</button>
                </div>
                <p class="text-body-secondary small mb-3">滑鼠移到按鈕上查看 hover，按住不放查看 active。</p>
                <!-- 按鈕格以 data-bs-theme 鎖定主題，灰底襯托方便區分透明底與主題底色 -->
                <div class="table-responsive">
                    <table class="table table-bordered align-middle w-auto mb-0">
                        <thead>
                            <tr>
                                <th scope="col">Class</th>
                                <th scope="col">Light</th>
                                <th scope="col">Dark</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <th scope="row"><code>btn_primary</code></th>
                                <td class="bg-body-secondary" data-bs-theme="light">
                                    <div class="d-flex flex-wrap gap-2">
                                        <button class="btn btn_primary" type="button"><i class="maskIcon maskIcon_home me-1"></i>實心底</button>
                                        <button class="btn btn_primary" type="button" disabled>停用</button>
                                    </div>
                                </td>
                                <td class="bg-body-secondary" data-bs-theme="dark">
                                    <div class="d-flex flex-wrap gap-2">
                                        <button class="btn btn_primary" type="button"><i class="maskIcon maskIcon_home me-1"></i>實心底</button>
                                        <button class="btn btn_primary" type="button" disabled>停用</button>
                                    </div>
                                </td>
                            </tr>

                            <tr>
                                <th scope="row"><code>btn_outline_primary</code></th>
                                <td class="bg-body-secondary" data-bs-theme="light">
                                    <div class="d-flex flex-wrap gap-2">
                                        <button class="btn btn_outline_primary" type="button"><i class="maskIcon maskIcon_home me-1"></i>透明底</button>
                                        <button class="btn btn_outline_primary" type="button" disabled>停用</button>
                                    </div>
                                </td>
                                <td class="bg-body-secondary" data-bs-theme="dark">
                                    <div class="d-flex flex-wrap gap-2">
                                        <button class="btn btn_outline_primary" type="button"><i class="maskIcon maskIcon_home me-1"></i>透明底</button>
                                        <button class="btn btn_outline_primary" type="button" disabled>停用</button>
                                    </div>
                                </td>
                            </tr>

                            <tr>
                                <th scope="row"><code>btn_outline_body_primary</code></th>
                                <td class="bg-body-secondary" data-bs-theme="light">
                                    <div class="d-flex flex-wrap gap-2">
                                        <button class="btn btn_outline_body_primary" type="button"><i class="maskIcon maskIcon_home me-1"></i>主題底</button>
                                        <button class="btn btn_outline_body_primary" type="button" disabled>停用</button>
                                    </div>
                                </td>
                                <td class="bg-body-secondary" data-bs-theme="dark">
                                    <div class="d-flex flex-wrap gap-2">
                                        <button class="btn btn_outline_body_primary" type="button"><i class="maskIcon maskIcon_home me-1"></i>主題底</button>
                                        <button class="btn btn_outline_body_primary" type="button" disabled>停用</button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <div id="modal">
            <script>$.get('_layout/modal.html', (res)=>{ $('#modal')[0].outerHTML = res })</script>
        </div>

        <footer>
            <script>$.get('_layout/footer.html', (res)=>{ $('footer')[0].outerHTML = res })</script>
        </footer>
    </div>

    <script>
        $('.js-theme-toggle').on('click', function(){
            const nextTheme = $html.attr('data-bs-theme') === 'dark' ? 'light' : 'dark'
            setTheme(nextTheme)
            storeTheme(nextTheme)
        })
    </script>
</body>
</html>
